syntax = "proto3";
package ET;

message HttpGetRouterResponse
{
	repeated string Realms = 1;
	repeated string Routers = 2;
}

message RouterSync
{
	uint32 ConnectId = 1;
	string Address = 2;
}

// ResponseType M2C_TestResponse
message C2M_TestRequest // ILocationRequest
{
	int32 RpcId = 1;
	string request = 2;
}

message M2C_TestResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string response = 4;
}

// ResponseType G2C_EnterMap
message C2G_EnterMap // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_EnterMap // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	/// 自己的UnitId
	int64 MyId = 4;
}

message MoveInfo
{
	repeated Unity.Mathematics.float3 Points = 1;
	Unity.Mathematics.quaternion Rotation = 2;
	int32 TurnSpeed = 3;
}

message UnitInfo
{
	int64 UnitId = 1;
	int32 ConfigId = 2;
	int32 Type = 3;
	Unity.Mathematics.float3 Position = 4;
	Unity.Mathematics.float3 Forward = 5;
	map<int32, int64> KV = 6;
	MoveInfo MoveInfo = 7;
}

message M2C_CreateUnits // IMessage
{
	repeated UnitInfo Units = 1;
}

message M2C_CreateMyUnit // IMessage
{
	UnitInfo Unit = 1;
}

message M2C_StartSceneChange // IMessage
{
	int64 SceneInstanceId = 1;
	string SceneName = 2;
}

message M2C_RemoveUnits // IMessage
{
	repeated int64 Units = 1;
}

message C2M_PathfindingResult // ILocationMessage
{
	int32 RpcId = 1;
	Unity.Mathematics.float3 Position = 2;
}

message C2M_Stop // ILocationMessage
{
	int32 RpcId = 1;
}

message M2C_PathfindingResult // IMessage
{
	int64 Id = 1;
	Unity.Mathematics.float3 Position = 2;
	repeated Unity.Mathematics.float3 Points = 3;
}

message M2C_Stop // IMessage
{
	int32 Error = 1;
	int64 Id = 2;
	Unity.Mathematics.float3 Position = 3;
	Unity.Mathematics.quaternion Rotation = 4;
}

// ResponseType G2C_Ping
message C2G_Ping // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Ping // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 Time = 4;
}


message G2C_Test // ISessionMessage
{
}

// ResponseType M2C_Reload
message C2M_Reload // ISessionRequest
{
	int32 RpcId = 1;
	string Account = 2;
	string Password = 3;
}

message M2C_Reload // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType R2C_Login
message C2R_Login // ISessionRequest
{
	int32 RpcId = 1;
	string  Account = 2;  // 帐号
	string  Password = 3;  // 密码
}

message R2C_Login // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string Address = 4;
	int64 Key = 5;
	int64 GateId = 6;
}

// ResponseType G2C_LoginGate
message C2G_LoginGate // ISessionRequest
{
	int32 RpcId = 1;
	int64 Key = 2;  // 帐号
	int64 GateId = 3;
}

message G2C_LoginGate // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 PlayerId = 4;
}

message G2C_TestHotfixMessage // ISessionMessage
{
	string Info = 1;
}

// ResponseType M2C_TestRobotCase
message C2M_TestRobotCase // ILocationRequest
{
	int32 RpcId = 1;
	int32 N = 2;
}

message M2C_TestRobotCase // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int32 N = 4;
}

message C2M_TestRobotCase2 // ILocationMessage
{
	int32 RpcId = 1;
	int32 N = 2;
}

message M2C_TestRobotCase2 // ILocationMessage
{
	int32 RpcId = 1;
	int32 N = 2;
}

// ResponseType M2C_TransferMap
message C2M_TransferMap // ILocationRequest
{
	int32 RpcId = 1;
}

message M2C_TransferMap // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_Benchmark
message C2G_Benchmark // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Benchmark // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_GetRoomList
message C2G_GetRoomList // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_GetRoomList // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated int64 RoomId = 4;
	repeated string RoomHolderName = 5;
	repeated int32 PlayerNum = 6;
}

// ResponseType G2C_CreateRoom
message C2G_CreateRoom // ISessionRequest
{
	int32 RpcId = 1;
	int64 PlayerId = 2;
}

message G2C_CreateRoom // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 RoomId = 4;
}

// ResponseType G2C_EnterRoom
message C2G_EnterRoom // ISessionRequest
{
	int32 RpcId = 1;
	int64 PlayerId = 2;
	int64 RoomId = 3;
}

message G2C_EnterRoom // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 RoomHolderId = 4;
	repeated int64 PlayerId = 5;
	repeated string PlayerName = 6;
}

message L2C_NewPlayer // IMessage
{
	string Name = 1;
	int64 PlayerId = 2;
}

message C2L_StartGame // ILobbyMessage
{
	int64 RoomId = 1;
}

message SFSUnitInfo
{
	int64 UnitId = 1;
	Unity.Mathematics.float3 Position = 2;
	Unity.Mathematics.quaternion Forward = 3;
	SFSUnitCamp Camp = 4;
	SFSUnitType Type = 5;
	SFSUnitState State = 6;
}

message Room2C_LoadGame // IMessage
{
	repeated SFSUnitInfo UnitInfos = 1;
	repeated int64 PlayerId = 2;
}

message C2Room_LoadGameDone // ISFSRoomMessage
{
	int64 PlayerId = 1;
}

message Room2C_SFSEnterGame // IMessage
{
	int64 StartTime = 1;
}

message MoveCmd // IRoomCmd
{
	int32 FrameId = 1;
	SFSCmdType CmdType = 2;
	int64 UnitId = 3;
	bool PassConsistencyCheck = 4;
	Unity.Mathematics.float3 Speed = 5;
	Unity.Mathematics.float3 Pos = 6;
	Unity.Mathematics.quaternion Rot = 7;
	bool FromClient = 8;
}

message SkillCmd // IRoomCmd
{
	int32 FrameId = 1;
	SFSCmdType CmdType = 2;
	int64 UnitId = 3;
	bool PassConsistencyCheck = 4;
	SFSSkillState State = 5;
	int32 Duration = 6;
	bool FromClient = 7;
	SFSUnitInfo Info = 8;
}

message Room2C_DeleteUnit // IRoomCmd
{
	int32 FrameId = 1;
	SFSCmdType CmdType = 2;
	int64 UnitId = 3;
	bool PassConsistencyCheck = 4;
	repeated int64 UnitToDelete = 5;
}

message Room2C_DebugInfo // IRoomCmd
{
	int32 FrameId = 1;
	SFSCmdType CmdType = 2;
	int64 UnitId = 3;
	bool PassConsistencyCheck = 4;
	repeated Unity.Mathematics.float3 Pos = 5;
	repeated float Radius = 6;
}

message StateCmd // IRoomCmd
{
	int32 FrameId = 1;
	SFSCmdType CmdType = 2;
	int64 UnitId = 3;
	bool PassConsistencyCheck = 4;
	SFSUnitState State = 5;
	int32 Duration = 6;
}

message AttributeCmd // IRoomCmd
{
	int32 FrameId = 1;
	SFSCmdType CmdType = 2;
	int64 UnitId = 3;
	bool PassConsistencyCheck = 4;
	int32 HP = 5;
}

message BuffCmd // IRoomCmd
{
	int32 FrameId = 1;
	SFSCmdType CmdType = 2;
	int64 UnitId = 3;
	bool PassConsistencyCheck = 4;
	SFSBuffType Type = 5;
}

message Room2C_OneFrameEnd // IMessage
{
	int32 FrameId = 1;
}